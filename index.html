<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantes — Sistema de Manutenção</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #ff6b2b;
    --accent2: #ff9f1c;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #2dd4a0;
    --error: #ff4757;
    --glow: rgba(255, 107, 43, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,107,43,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,107,43,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 60px rgba(255, 107, 43, 0.3);
    letter-spacing: -2px;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
  }

  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 20px 60px rgba(255, 107, 43, 0.15);
  }

  h2 {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    margin-bottom: 24px;
    color: var(--text);
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input, textarea, select {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(255, 107, 43, 0.2);
  }

  textarea {
    min-height: 120px;
    resize: vertical;
  }

  .btn {
    display: inline-block;
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--bg);
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    width: 100%;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 40px rgba(255, 107, 43, 0.4);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .file-upload {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .file-upload:hover {
    border-color: var(--accent);
    background: rgba(255, 107, 43, 0.05);
  }

  .file-upload input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .file-upload-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .file-list {
    margin-top: 16px;
  }

  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: var(--surface2);
    border-radius: 8px;
    margin-top: 8px;
    font-size: 13px;
  }

  .file-item .remove {
    color: var(--error);
    cursor: pointer;
    padding: 4px 8px;
  }

  .alert {
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 24px;
    display: none;
  }

  .alert.show {
    display: block;
  }

  .alert-success {
    background: rgba(45, 212, 160, 0.1);
    border: 1px solid var(--success);
    color: var(--success);
  }

  .alert-error {
    background: rgba(255, 71, 87, 0.1);
    border: 1px solid var(--error);
    color: var(--error);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 600px) {
    .row {
      grid-template-columns: 1fr;
    }
    
    .logo {
      font-size: 48px;
    }
  }

  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .user-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding: 16px;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .user-info span {
    color: var(--muted);
    font-size: 13px;
  }

  .btn-logout {
    padding: 8px 16px;
    font-size: 12px;
    width: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .btn-logout:hover {
    border-color: var(--error);
    color: var(--error);
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="logo">MANTES</h1>
      <p class="subtitle">Sistema de Gestão de Manutenção</p>
    </header>

    <!-- Login Card -->
    <div id="loginCard" class="card">
      <h2>🔐 Acesso</h2>
      <div id="loginAlert" class="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" id="btnLogin">
          Entrar
        </button>
      </form>
    </div>

    <!-- Main Form Card -->
    <div id="mainCard" class="card" style="display: none;">
      <div class="user-info">
        <span id="userInfo">Bem-vindo, <strong id="userName"></strong></span>
        <button class="btn btn-logout" id="btnLogout">Sair</button>
      </div>

      <h2>📋 Nova Ordem de Serviço</h2>

      <div id="formAlert" class="alert"></div>

      <form id="osForm" enctype="multipart/form-data">
        <div class="row">
          <div class="form-group">
            <label for="numero">Número da OS</label>
            <input type="text" id="numero" readonly>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
          </div>
          <div class="form-group">
            <label for="nomeCliente">Nome do Cliente</label>
            <input type="text" id="nomeCliente" required>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" maxlength="15">
          </div>
          <div class="form-group">
            <label for="nomeTecnico">Técnico Responsável</label>
            <input type="text" id="nomeTecnico" required>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="lider">Líder</label>
            <input type="text" id="lider" required>
          </div>
          <div class="form-group">
            <label for="emailLider">E-mail do Líder</label>
            <input type="email" id="emailLider" required>
          </div>
        </div>

        <div class="form-group">
          <label for="tipoSolicitacao">Tipo de Solicitação</label>
          <select id="tipoSolicitacao" required>
            <option value="">Selecione...</option>
            <option value="Preventiva">Manutenção Preventiva</option>
            <option value="Corretiva">Manutenção Corretiva</option>
            <option value="Emergencial">Emergencial</option>
            <option value="Instalacao">Instalação</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição Detalhada</label>
          <textarea id="descricao" required placeholder="Descreva o serviço a ser realizado..."></textarea>
        </div>

        <div class="form-group">
          <label>Anexos (fotos, documentos)</label>
          <div class="file-upload" id="fileUpload">
            <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
            <div class="file-upload-icon">📎</div>
            <div>Arraste arquivos ou clique para selecionar</div>
            <div style="color: var(--muted); font-size: 12px; margin-top: 8px;">
              Máximo 10 arquivos, 10MB cada
            </div>
          </div>
          <div class="file-list" id="fileList"></div>
        </div>

        <button type="submit" class="btn" id="btnSubmit">
          Criar Ordem de Serviço
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/api.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
