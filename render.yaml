services:
  - type: web
    name: mantes
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
