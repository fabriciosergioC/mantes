# Schema GraphQL para Hasura (Nhost)
# Tabelas: users e orders (Ordens de Serviço)

type User {
  id: uuid!
  email: String!
  nome: String!
  lider: Boolean!
  created_at: timestamptz!
  updated_at: timestamptz!
  orders: [Order!]!
}

type Order {
  id: uuid!
  numero: String!
  cliente_id: String
  cnpj: String
  nome_cliente: String
  telefone: String
  nome_tecnico: String
  lider: String
  email_lider: String
  tipo_solicitacao: String
  descricao: String
  status: String!
  observacoes: jsonb
  data_abertura: timestamptz!
  data_fechamento: timestamptz
  arquivos: jsonb
  created_at: timestamptz!
  updated_at: timestamptz!
  user_id: uuid!
  user: User!
}

input OrderInput {
  numero: String!
  cliente_id: String
  cnpj: String
  nome_cliente: String
  telefone: String
  nome_tecnico: String
  lider: String
  email_lider: String
  tipo_solicitacao: String
  descricao: String
  status: String
  arquivos: jsonb
}

input OrderUpdateInput {
  status: String
  observacoes: jsonb
  data_fechamento: timestamptz
}
