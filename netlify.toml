[build]
  publish = "."
  command = "echo 'Sem build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API redirect - usa splat para capturar todo o path
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback - deve vir por último
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
