[build]
  publish = "."
  command = "echo 'Sem build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API redirects - devem vir antes do SPA fallback
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api.js"
  status = 200
  force = true

# SPA fallback - deve vir por último
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
